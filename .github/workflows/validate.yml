name: Validate

on:
  push:
    branches:
      - main
      - feature/**
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: spacecase
          POSTGRES_PASSWORD: spacecase
          POSTGRES_DB: spacecase_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U spacecase -d spacecase_test"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10

    env:
      DATABASE_URL: postgresql://spacecase:spacecase@127.0.0.1:5432/spacecase_test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Create restricted runtime test role
        run: PGPASSWORD=spacecase psql --host=127.0.0.1 --username=spacecase --dbname=spacecase_test -v ON_ERROR_STOP=1 -c "CREATE ROLE spacecase_runtime NOLOGIN NOSUPERUSER NOBYPASSRLS"
      - name: Run database migrations
        run: npm run db:migrate

      - name: Verify migration state
        run: |
          test "$(PGPASSWORD=spacecase psql --host=127.0.0.1 --username=spacecase --dbname=spacecase_test -Atc "SELECT count(*) FROM audit.schema_migrations WHERE migration_name = '0001_spacecase_foundation.sql'")" = "1"
          test "$(PGPASSWORD=spacecase psql --host=127.0.0.1 --username=spacecase --dbname=spacecase_test -Atc "SELECT count(*) FROM audit.schema_migrations WHERE migration_name = '0002_stos_school_context.sql'")" = "1"
          test "$(PGPASSWORD=spacecase psql --host=127.0.0.1 --username=spacecase --dbname=spacecase_test -Atc "SELECT count(*) FROM audit.schema_migrations WHERE migration_name = '0003_stos_learner_profile.sql'")" = "1"
          test "$(PGPASSWORD=spacecase psql --host=127.0.0.1 --username=spacecase --dbname=spacecase_test -Atc "SELECT count(*) FROM audit.schema_migrations WHERE migration_name = '0004_stos_interventions.sql'")" = "1"
          test "$(PGPASSWORD=spacecase psql --host=127.0.0.1 --username=spacecase --dbname=spacecase_test -Atc "SELECT count(*) FROM audit.schema_migrations WHERE migration_name = '0005_stos_communication.sql'")" = "1"
          test "$(PGPASSWORD=spacecase psql --host=127.0.0.1 --username=spacecase --dbname=spacecase_test -Atc "SELECT count(*) FROM audit.schema_migrations WHERE migration_name = '0006_stos_sta_foundation.sql'")" = "1"
          test "$(PGPASSWORD=spacecase psql --host=127.0.0.1 --username=spacecase --dbname=spacecase_test -Atc "SELECT to_regclass('audit.product_audit_events') IS NOT NULL")" = "t"
          test "$(PGPASSWORD=spacecase psql --host=127.0.0.1 --username=spacecase --dbname=spacecase_test -Atc "SELECT to_regclass('school_ops.school_workspaces') IS NOT NULL")" = "t"
          test "$(PGPASSWORD=spacecase psql --host=127.0.0.1 --username=spacecase --dbname=spacecase_test -Atc "SELECT to_regclass('school_ops.class_workspaces') IS NOT NULL")" = "t"
          test "$(PGPASSWORD=spacecase psql --host=127.0.0.1 --username=spacecase --dbname=spacecase_test -Atc "SELECT to_regclass('learning.learner_profiles') IS NOT NULL")" = "t"
          test "$(PGPASSWORD=spacecase psql --host=127.0.0.1 --username=spacecase --dbname=spacecase_test -Atc "SELECT to_regclass('learning.interventions') IS NOT NULL")" = "t"
          test "$(PGPASSWORD=spacecase psql --host=127.0.0.1 --username=spacecase --dbname=spacecase_test -Atc "SELECT to_regclass('communication.parent_messages') IS NOT NULL")" = "t"
          test "$(PGPASSWORD=spacecase psql --host=127.0.0.1 --username=spacecase --dbname=spacecase_test -Atc "SELECT to_regclass('assistant.teacher_requests') IS NOT NULL")" = "t"

          test "$(PGPASSWORD=spacecase psql --host=127.0.0.1 --username=spacecase --dbname=spacecase_test -Atc "SELECT count(*) FROM audit.schema_migrations WHERE migration_name = '0007_class_attendance.sql'")" = "1"
          test "$(PGPASSWORD=spacecase psql --host=127.0.0.1 --username=spacecase --dbname=spacecase_test -Atc "SELECT to_regclass('learning.attendance_registers') IS NOT NULL AND to_regclass('learning.attendance_entries') IS NOT NULL")" = "t"

          test "$(PGPASSWORD=spacecase psql --host=127.0.0.1 --username=spacecase --dbname=spacecase_test -Atc "SELECT count(*) FROM audit.schema_migrations WHERE migration_name = '0008_support_control_centre.sql'")" = "1"
          test "$(PGPASSWORD=spacecase psql --host=127.0.0.1 --username=spacecase --dbname=spacecase_test -Atc "SELECT to_regclass('support.tickets') IS NOT NULL AND to_regclass('support.events') IS NOT NULL AND to_regclass('support.proposals') IS NOT NULL")" = "t"

      - name: Verify billing migration state
        run: |
          test "$(PGPASSWORD=spacecase psql --host=127.0.0.1 --username=spacecase --dbname=spacecase_test -Atc "SELECT count(*) FROM audit.schema_migrations WHERE migration_name='0009_founder_insights_billing.sql'")" = "1"
          test "$(PGPASSWORD=spacecase psql --host=127.0.0.1 --username=spacecase --dbname=spacecase_test -Atc "SELECT has_table_privilege('spacecase_runtime','billing.invoices','SELECT') AND NOT has_column_privilege('spacecase_runtime','billing.invoices','amount_cents','UPDATE') AND NOT has_table_privilege('spacecase_runtime','billing.receipts','DELETE')")" = "t"
      - name: Verify casework migration state
        run: |
          test "$(PGPASSWORD=spacecase psql --host=127.0.0.1 --username=spacecase --dbname=spacecase_test -Atc "SELECT count(*) FROM audit.schema_migrations WHERE migration_name='0010_support_casework.sql'")" = "1"
          test "$(PGPASSWORD=spacecase psql --host=127.0.0.1 --username=spacecase --dbname=spacecase_test -Atc "SELECT has_table_privilege('spacecase_runtime','support.ticket_work','UPDATE') AND NOT has_table_privilege('spacecase_runtime','support.work_events','UPDATE') AND NOT has_table_privilege('spacecase_runtime','support.work_requests','DELETE')")" = "t"
      - name: Verify planner migration state
        run: |
          test "$(PGPASSWORD=spacecase psql --host=127.0.0.1 --username=spacecase --dbname=spacecase_test -Atc "SELECT count(*) FROM audit.schema_migrations WHERE migration_name='0011_teacher_weekly_planner.sql'")" = "1"
          test "$(PGPASSWORD=spacecase psql --host=127.0.0.1 --username=spacecase --dbname=spacecase_test -Atc "SELECT has_table_privilege('spacecase_runtime','learning.weekly_lesson_plans','UPDATE') AND NOT has_table_privilege('spacecase_runtime','learning.weekly_lesson_plans','DELETE')")" = "t"
      - name: Verify assessment migration state
        run: |
          test "$(PGPASSWORD=spacecase psql --host=127.0.0.1 --username=spacecase --dbname=spacecase_test -Atc "SELECT count(*) FROM audit.schema_migrations WHERE migration_name='0012_assessment_workflow.sql'")" = "1"
          test "$(PGPASSWORD=spacecase psql --host=127.0.0.1 --username=spacecase --dbname=spacecase_test -Atc "SELECT has_table_privilege('spacecase_runtime','assessment.results','INSERT') AND NOT has_table_privilege('spacecase_runtime','assessment.results','UPDATE') AND NOT has_table_privilege('spacecase_runtime','assessment.results','DELETE') AND NOT has_table_privilege('spacecase_runtime','assessment.result_events','UPDATE') AND NOT has_schema_privilege('spacecase_runtime','assessment','CREATE')")" = "t"
      - name: Verify vision reading migration state
        run: |
          test "$(PGPASSWORD=spacecase psql --host=127.0.0.1 --username=spacecase --dbname=spacecase_test -Atc "SELECT count(*) FROM audit.schema_migrations WHERE migration_name='0013_assessment_vision_reading.sql'")" = "1"
          test "$(PGPASSWORD=spacecase psql --host=127.0.0.1 --username=spacecase --dbname=spacecase_test -Atc "SELECT has_column_privilege('spacecase_runtime','assessment.submissions','reading_review','UPDATE') AND has_column_privilege('spacecase_runtime','assessment.ai_runs','execution_claimed_at','UPDATE') AND NOT has_table_privilege('spacecase_runtime','assessment.results','UPDATE')")" = "t"
      - name: Verify homework migration state
        run: |
          test "$(PGPASSWORD=spacecase psql --host=127.0.0.1 --username=spacecase --dbname=spacecase_test -Atc "SELECT count(*) FROM audit.schema_migrations WHERE migration_name='0014_teacher_homework.sql'")" = "1"
          test "$(PGPASSWORD=spacecase psql --host=127.0.0.1 --username=spacecase --dbname=spacecase_test -Atc "SELECT has_table_privilege('spacecase_runtime','learning.homework_tasks','UPDATE') AND has_table_privilege('spacecase_runtime','learning.homework_events','INSERT') AND NOT has_table_privilege('spacecase_runtime','learning.homework_events','UPDATE') AND NOT has_table_privilege('spacecase_runtime','learning.homework_events','DELETE') AND NOT has_table_privilege('spacecase_runtime','learning.homework_tasks','DELETE')")" = "t"
      - name: Verify observations migration state
        run: |
          test "$(PGPASSWORD=spacecase psql --host=127.0.0.1 --username=spacecase --dbname=spacecase_test -Atc "SELECT count(*) FROM audit.schema_migrations WHERE migration_name='0015_classroom_observations.sql'")" = "1"
          test "$(PGPASSWORD=spacecase psql --host=127.0.0.1 --username=spacecase --dbname=spacecase_test -Atc "SELECT has_column_privilege('spacecase_runtime','learning.classroom_observations','evidence','UPDATE') AND NOT has_column_privilege('spacecase_runtime','learning.classroom_observations','teacher_person_id','UPDATE') AND has_table_privilege('spacecase_runtime','learning.observation_revisions','INSERT') AND NOT has_table_privilege('spacecase_runtime','learning.observation_revisions','UPDATE') AND NOT has_table_privilege('spacecase_runtime','learning.observation_revisions','DELETE') AND NOT has_table_privilege('spacecase_runtime','learning.classroom_observations','DELETE')")" = "t"
      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Create isolated PSG engineering test database
        run: |
          PGPASSWORD=spacecase psql --host=127.0.0.1 --username=spacecase --dbname=spacecase_test -v ON_ERROR_STOP=1 -c "CREATE ROLE psg_engineering_runtime NOLOGIN NOSUPERUSER NOBYPASSRLS NOCREATEDB NOCREATEROLE"
          PGPASSWORD=spacecase psql --host=127.0.0.1 --username=spacecase --dbname=spacecase_test -v ON_ERROR_STOP=1 -c "CREATE DATABASE psg_engineering_test"
      - name: PSG AI service checks
        env:
          PSG_ENGINEERING_TEST_DATABASE_URL: postgresql://spacecase:spacecase@127.0.0.1:5432/psg_engineering_test
        run: npm run typecheck --workspace=psg-ai && npm run test --workspace=psg-ai
      - name: Production build
        run: npm run build
      - name: PSG AI service build
        run: npm run build --workspace=psg-ai
